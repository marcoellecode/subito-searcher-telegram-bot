services:
  subito-searcher:
    # immagine pubblicata dal workflow GitHub; per costruirla in locale: docker compose up -d --build
    image: ghcr.io/marcoellecode/subito-searcher-telegram-bot:latest
    build: .
    container_name: subito-searcher
    restart: unless-stopped
    environment:
      - TZ=Europe/Rome
      # opzionali: se impostate creano/aggiornano bindata/telegram_api_credentials
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # facoltativa: password dell'interfaccia web (utente qualsiasi)
      - WEBUI_PASSWORD=${WEBUI_PASSWORD:-}
    ports:
      # interfaccia web, raggiungibile solo dalla rete locale
      - "8095:8080"
    volumes:
      # qui vanno searches.tracked e telegram_api_credentials
      - ./bindata:/data
    # permette di scrivere in chat dal terminale con "docker attach --sig-proxy=false subito-searcher"
    # (Ctrl+C stacca senza fermare il container)
    stdin_open: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
